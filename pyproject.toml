[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelscope"
version = "0.1.0"
description = "Measurement- and simulation-driven dynamic selection of the attention kernel split for LLM decode"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
gpu = ["torch", "flash-attn"]
viz = ["streamlit>=1.64", "plotly>=6", "matplotlib"]
serve = ["torch", "flash-attn", "safetensors>=0.4", "tokenizers>=0.22,<0.23"]
validation = ["transformers==4.57.6", "playwright>=1.50"]
dev = ["pytest"]

[project.scripts]
kernelscope = "kernelscope.cli:main"

[tool.setuptools.packages.find]
include = ["kernelscope*"]

[tool.setuptools.package-data]
"kernelscope.model" = ["_simulate_native.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA device (deselect with -m 'not gpu')",
    "ncu: needs Nsight Compute on PATH and counter permission",
    "accelsim: needs a built Accel-Sim + NVBit tracer",
]
